[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plump-ipc"
version = "0.1.0"
description = "A lightweight, asyncio-native IPC framework for seamless communication over multiprocessing pipes."
readme = "README.md"
authors = [
    { name = "GrumpyChubbyCat", email = "lamantin-ai@yandex.ru" },
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
]

[project.urls]
Homepage = "https://github.com/LamantinAI/plump-ipc"

[tool.hatch.build.targets.wheel]
packages = ["plump_ipc"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s,%(msecs)03d %(levelname).8s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"